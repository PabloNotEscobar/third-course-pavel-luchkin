<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анализатор чисел</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Анализатор чисел</h1>

  <div class="controls">
    <input type="number" id="numberInput" placeholder="Введите число">
    <button id="addBtn">Добавить</button>
    <button id="removeLastBtn">Удалить последнее</button>
    <button id="clearBtn">Очистить</button>
  </div>

  <p id="error" class="error"></p>

  <h2>Список чисел</h2>
  <ul id="list"></ul>

  <h2>Статистика</h2>
  <table>
    <tr><td>Количество</td><td id="count">0</td></tr>
    <tr><td>Сумма</td><td id="sum">0</td></tr>
    <tr><td>Среднее</td><td id="average">—</td></tr>
    <tr><td>Минимум</td><td id="min">—</td></tr>
    <tr><td>Максимум</td><td id="max">—</td></tr>
  </table>

  <script src="app.js"></script>
</body>
</html>
